<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製造予定表</title>
    <!-- SortableJSライブラリの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        /* --- CSS変数の定義 --- */
        :root {
            --primary-color: #2a9d8f;
            --secondary-color: #e76f51;
            --accent-color: #e9c46a;
            --text-color: #333;
            --text-color-light: #fff;
            --bg-color: #f4f7f6;
            --border-color: #eee;
            --holiday-color: #e0535d;
            --saturday-color: #007bff;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
            
            /* イベントごとの色 */
            --event-shoyu-bg: #343a40;
            --event-miso-bg: #28a745;
            --event-natto-bg: #e0535d;
            --event-yasumi-bg: #8a63d2;
            --event-default-bg: #d4a017; /* 視認性向上のため少し濃く */
        }

        /* --- 基本スタイル --- */
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px 0;
            padding-top: 40px; 
            color: var(--text-color);
        }

        /* --- 保存ステータス表示 --- */
        #save-status {
            position: fixed; top: 0; left: 0; width: 100%;
            text-align: center; padding: 10px 0; height: 20px;
            font-weight: 500; opacity: 0; z-index: 1001;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: opacity 0.5s, color 0.5s;
        }
        #save-status.is-visible { opacity: 1; }
        #save-status.is-saving { color: #888; }
        #save-status.is-saved { color: var(--primary-color); }
        #save-status.is-error { color: var(--secondary-color); }

        /* --- カレンダーコンテナ --- */
        .calendar-container {
            width: 95%; max-width: 900px; margin: auto;
            background: var(--text-color-light);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border-radius: 10px; overflow: hidden;
            transition: box-shadow 0.3s ease-in-out;
        }
        .calendar-container.drag-mode-active {
            box-shadow: 0 0 0 3px var(--secondary-color), 0 6px 12px rgba(0,0,0,0.1);
        }

        /* --- ヘッダー --- */
        .calendar-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background-color: var(--primary-color);
            color: var(--text-color-light);
        }
        .calendar-header button {
            background: none; border: none; color: var(--text-color-light);
            font-size: 1.8em; cursor: pointer; transition: transform 0.2s;
        }
        .calendar-header button:hover { transform: scale(1.1); }

        .header-center {
            display: flex; align-items: center; gap: 15px;
            position: absolute; left: 50%; transform: translateX(-50%);
        }
        #month-year { font-size: 1.4em; font-weight: 600; white-space: nowrap; }
        
        #list-view-toggle, #print-list-btn {
            font-size: 0.9em; padding: 8px 15px; border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.2); color: var(--text-color-light);
            border: 1px solid rgba(255, 255, 255, 0.3); cursor: pointer;
            transition: background-color 0.2s; white-space: nowrap;
        }
        #list-view-toggle:hover, #print-list-btn:hover { background-color: rgba(255, 255, 255, 0.3); }

        /* --- カレンダーグリッド --- */
        .calendar-grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .calendar-grid th {
            text-align: center; padding: 12px 5px;
            border-bottom: 2px solid var(--border-color);
            background-color: #f9f9f9; font-size: 0.9em; font-weight: 600;
            color: #555; white-space: nowrap;
        }
        .calendar-grid td {
            border: 1px solid var(--border-color); vertical-align: top;
            height: 150px; padding: 4px; transition: background-color 0.2s;
            cursor: pointer;
        }
        .calendar-grid td:hover { background-color: #e9f5ff; }
        .calendar-grid td.other-month { color: #ccc; background-color: #fafafa; }
        .calendar-grid td.other-month:hover { background-color: #e9f5ff; }

        /* --- 日付セル内の要素 --- */
        .day-header-container { display: flex; align-items: center; margin-bottom: 4px; }
        .day-number {
            font-weight: 500; font-size: 0.9em; border-radius: 50%;
            width: 22px; height: 22px; display: inline-flex;
            align-items: center; justify-content: center;
        }
        .calendar-grid td.today .day-number {
            background-color: var(--primary-color); color: var(--text-color-light) !important;
        }
        .day-number.saturday { color: var(--saturday-color); }
        .day-number.sunday, .day-number.holiday { color: var(--holiday-color); }
        .holiday-name {
            font-size: 0.7em; color: var(--holiday-color); margin-left: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* --- イベントリスト --- */
        .events-list {
            list-style: none; padding: 0; margin: 0;
            font-size: 0.8em; height: 118px; overflow-y: auto;
        }
        .events-list li {
            display: flex; align-items: center; padding: 3px 5px;
            border-radius: 3px; margin-bottom: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: var(--text-color-light);
        }
        /* イベント色設定 */
        .events-list li.event-shoyu, .list-view-event-item > span.event-shoyu { background-color: var(--event-shoyu-bg); }
        .events-list li.event-miso, .list-view-event-item > span.event-miso { background-color: var(--event-miso-bg); }
        .events-list li.event-natto, .list-view-event-item > span.event-natto { background-color: var(--event-natto-bg); }
        .events-list li.event-yasumi, .list-view-event-item > span.event-yasumi { background-color: var(--event-yasumi-bg); }
        .events-list li.event-default, .list-view-event-item > span.event-default {
            background-color: var(--event-default-bg); color: var(--text-color-light);
        }
        /* リスト表示時の文字色調整 */
        .list-view-event-item > span.event-shoyu,
        .list-view-event-item > span.event-miso,
        .list-view-event-item > span.event-natto,
        .list-view-event-item > span.event-yasumi,
        .list-view-event-item > span.event-default { color: var(--text-color-light); }

        .drag-handle {
            cursor: grab; margin-right: 8px; opacity: 0.3; transition: opacity 0.2s;
        }
        .drag-handle:hover { opacity: 0.8; }
        .drag-handle:active { cursor: grabbing; }

        /* --- 編集モード切り替えボタン --- */
        .edit-mode-container { text-align: center; margin: 20px 0; }
        #drag-mode-toggle {
            padding: 10px 20px; font-size: 1em; font-weight: 500;
            border-radius: 8px; border: 1px solid #ccc;
            background-color: #f0f0f0; cursor: pointer;
            transition: background-color 0.2s;
        }
        #drag-mode-toggle:hover { background-color: #e0e0e0; }
        #drag-mode-toggle.active {
            background-color: var(--secondary-color); color: var(--text-color-light);
            border-color: var(--secondary-color);
        }

        /* --- モーダル --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--text-color-light); padding: 25px; border-radius: 8px;
            width: 90%; max-width: 450px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px; margin-bottom: 15px;
        }
        .modal-close {
            font-size: 1.8rem; font-weight: bold; cursor: pointer;
            border: none; background: none; color: #888;
        }
        #event-date { font-size: 1.2em; font-weight: 600; color: var(--primary-color); }
        
        #template-buttons {
            margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .template-btn {
            background-color: #f0f0f0; border: 1px solid #ddd;
            border-radius: 15px; padding: 5px 12px; cursor: pointer;
            font-size: 0.9em; transition: background-color 0.2s;
        }
        .template-btn:hover { background-color: #e0e0e0; }

        #modal-events-list {
            list-style: none; padding: 0; margin: 0 0 20px;
            max-height: 40vh; overflow-y: auto;
        }
        #modal-events-list li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; border-bottom: 1px solid #f0f0f0;
        }
        #modal-events-list .event-text, #modal-events-list .event-input {
            flex-grow: 1; cursor: pointer; padding: 5px; min-width: 0;
        }
        #modal-events-list .event-input {
            border: 1px solid var(--primary-color); border-radius: 4px;
        }
        .delete-event {
            background: var(--secondary-color); color: var(--text-color-light);
            border: none; border-radius: 4px; cursor: pointer;
            padding: 4px 8px; font-size: 0.8em; margin-left: 10px; flex-shrink: 0;
        }

        .add-event-form { display: flex; margin-bottom: 20px; }
        #new-event-text {
            flex-grow: 1; border: 1px solid #ccc; border-radius: 4px;
            padding: 10px; margin-right: 10px;
        }
        #add-event-button {
            background-color: #6c757d; color: var(--text-color-light);
            border: none; padding: 10px 15px; border-radius: 5px;
            cursor: pointer; font-weight: 500;
        }

        .modal-footer {
            border-top: 1px solid var(--border-color); padding-top: 15px; text-align: center;
        }
        #save-modal-btn {
            background-color: var(--primary-color); color: var(--text-color-light);
            border: none; padding: 12px 40px; border-radius: 5px;
            cursor: pointer; font-weight: 600; font-size: 1.1em;
            transition: background-color 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #save-modal-btn:hover { background-color: #21867a; }

        /* --- リスト表示 --- */
        #list-view {
            padding: 15px 25px; background-color: var(--text-color-light);
            touch-action: pan-y; display: none;
        }
        #print-title { display: none; }
        .list-view-events { list-style: none; padding: 0; margin: 0; }
        .list-view-day-item {
            margin-bottom: 2px; border-bottom: 1px solid var(--border-color);
            padding: 10px 8px; cursor: pointer; transition: background-color 0.2s;
            border-radius: 5px;
        }
        .list-view-day-item:hover { background-color: #f9f9f9; }
        .list-view-day-item:last-child { border-bottom: none; }
        .list-view-date-header { font-size: 1.1em; margin-bottom: 5px; color: var(--text-color); }
        .list-view-date-header strong { color: var(--primary-color); }
        .list-view-holiday-name { color: var(--holiday-color); font-size: 0.9em; margin-left: 5px; }
        .list-view-day-events { list-style: none; padding-left: 15px; margin: 0; }
        .list-view-event-item { padding: 0; font-size: 0.9em; margin-bottom: 3px; }
        .list-view-event-item > span { padding: 4px 8px; border-radius: 3px; display: inline-block; }
        .list-view-no-events {
            padding-left: 15px; margin: 5px 0; color: #999; font-size: 0.9em; font-style: italic;
        }

        /* --- レスポンシブ & 印刷設定 --- */
        @media (max-width: 768px) {
            body { padding: 0; padding-top: 40px; }
            .calendar-container { width: 100%; border-radius: 0; box-shadow: none; }
            .calendar-header { padding: 10px 15px; }
            .header-center { position: static; transform: none; order: 2; flex-grow: 1; justify-content: center; }
            #prev-month { order: 1; }
            #next-month { order: 3; }
            #month-year { font-size: 1.1em; }
            #list-view-toggle, #print-list-btn { font-size: 0.8em; padding: 6px 10px; }
            #print-list-btn { display: none !important; }
            .calendar-grid th { padding: 8px 2px; font-size: 0.7em; }
            .calendar-grid td { height: 110px; padding: 4px; }
            .day-number { font-size: 0.8em; }
            .events-list { font-size: 0.7em; height: auto; max-height: none; }
            .events-list li { padding: 2px 4px; }
            .modal-content { padding: 20px; }
            #event-date { font-size: 1.1em; }
        }

        @media print {
            body { background-color: var(--text-color-light); padding: 0; margin: 0; font-size: 12pt; }
            .calendar-header, .edit-mode-container, #save-status, .modal-overlay { display: none !important; }
            #list-view { display: block !important; padding: 5mm 10mm; }
            #print-title {
                display: block; font-size: 16pt; text-align: center;
                margin-bottom: 15px; color: #000;
            }
            .calendar-container { width: 100%; max-width: 100%; box-shadow: none; border: none; }
            .list-view-day-item { page-break-inside: avoid; }
            .list-view-day-item.has-no-events { display: none; }
            .list-view-event-item { font-size: 13pt; padding: 4px 0; }
            .list-view-event-item > span {
                padding: 0; border-radius: 0; color: #000 !important;
                background-color: transparent !important;
            }
        }
        @page { size: auto; margin: 0mm; }
    </style>
</head>
<body>

    <div id="save-status"></div>

    <div class="calendar-container">
        <div class="calendar-header">
            <button id="prev-month"><</button>
            <div class="header-center">
                <button id="print-list-btn" style="display: none;">印刷</button>
                <h2 id="month-year"></h2>
                <button id="list-view-toggle">リスト表示</button>
            </div>
            <button id="next-month">></button>
        </div>

        <table class="calendar-grid" id="calendar-grid-table">
            <thead>
                <tr>
                    <th class="th-weekend">日</th>
                    <th class="th-weekday">月</th>
                    <th class="th-weekday">火</th>
                    <th class="th-weekday">水</th>
                    <th class="th-weekday">木</th>
                    <th class="th-weekday">金</th>
                    <th class="th-weekend">土</th>
                </tr>
            </thead>
            <tbody id="calendar-body"></tbody>
        </table>

        <div id="list-view">
            <h1 id="print-title"></h1>
        </div>
    </div>

    <div class="edit-mode-container">
        <button id="drag-mode-toggle">レイアウト編集を開始</button>
    </div>

    <!-- モーダルウィンドウ -->
    <div id="event-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="event-date"></h3>
                <button class="modal-close">&times;</button>
            </div>
            <div id="template-buttons"></div>
            <ul id="modal-events-list"></ul>
            <form class="add-event-form" id="add-event-form">
                <input type="text" id="new-event-text" placeholder="または、自由に予定を入力...">
                <button id="add-event-button" type="submit">追加</button>
            </form>
            <div class="modal-footer">
                <button id="save-modal-btn">保存</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // --- 定数定義 ---
        const CONSTANTS = {
            EVENT_TEMPLATES: ["【醤油】", "【味噌】", "【納豆】", "【休み】"],
            API_URLS: {
                // ★ここにデプロイしたGASのURLを貼り付けてください★
                GAS: 'https://script.google.com/macros/s/AKfycbxU8VCxCv524lCe4JHLd8KSMrC8U5Vy8GsfhaXiidT36YxAzbVo-Ik4u51cKK0ww1CV/exec',
                HOLIDAYS: 'https://holidays-jp.github.io/api/v1/date.json',
            },
            SWIPE_THRESHOLD: 50,
            SAVE_DEBOUNCE_MS: 1500,
            SELECTORS: {
                calendarContainer: '.calendar-container', monthYear: '#month-year', calendarBody: '#calendar-body',
                prevMonthBtn: '#prev-month', nextMonthBtn: '#next-month', eventModal: '#event-modal',
                modalCloseBtn: '.modal-close', eventDate: '#event-date', templateButtons: '#template-buttons',
                modalEventsList: '#modal-events-list', newEventText: '#new-event-text', addEventForm: '#add-event-form',
                dragModeToggle: '#drag-mode-toggle', saveStatus: '#save-status', listViewToggle: '#list-view-toggle',
                calendarGridTable: '#calendar-grid-table', listView: '#list-view', editModeContainer: '.edit-mode-container',
                printListBtn: '#print-list-btn', printTitle: '#print-title', saveModalBtn: '#save-modal-btn'
            }
        };

        // --- ユーティリティ ---
        const Utils = {
            escapeHtml: (str) => {
                if (typeof str !== 'string') return str;
                return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
            },
            generateUUID: () => {
                if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            },
            formatDate: (date) => {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            }
        };

        // --- DOM管理 ---
        class DOMManager {
            constructor() {
                this.elements = {};
                for (const [key, selector] of Object.entries(CONSTANTS.SELECTORS)) {
                    this.elements[key] = document.querySelector(selector);
                }
            }
            get(key) { return this.elements[key]; }
        }

        // --- API通信 ---
        class ApiService {
            async _fetchJSON(url) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    console.error(`Error fetching from ${url}:`, error);
                    throw error;
                }
            }
            
            fetchEvents(start = null, end = null) {
                let url = CONSTANTS.API_URLS.GAS;
                if (start && end) {
                    const separator = url.includes('?') ? '&' : '?';
                    url += `${separator}start=${start}&end=${end}`;
                }
                return this._fetchJSON(url).catch(() => {
                    alert('データの読み込みに失敗しました。GASのデプロイ設定を確認してください。');
                    return {};
                });
            }

            // 修正: 範囲(range)も送信し、no-corsを削除
            saveEvents(events, range) {
                return fetch(CONSTANTS.API_URLS.GAS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ events, range }),
                }).then(response => {
                    if (!response.ok) throw new Error(`Server error: ${response.status}`);
                    return response.json();
                }).catch(error => {
                    console.error('Error saving events:', error);
                    alert('データの保存中にエラーが発生しました。');
                    throw error;
                });
            }
            fetchHolidays() { return this._fetchJSON(CONSTANTS.API_URLS.HOLIDAYS).catch(() => ({})); }
        }

        // --- データストア (状態管理) ---
        class Store {
            constructor() {
                this.events = {};
                this.holidays = {};
                this.calendarDate = new Date();
                this.listDate = new Date();
                this.selectedDate = null;
                this.isDragModeEnabled = false;
                this.isListViewEnabled = false;
                this.editingEvents = [];
                // 追加: 現在表示中のデータ範囲
                this.currentRange = { start: null, end: null };
            }

            mergeEvents(newEvents) {
                this.events = { ...this.events, ...newEvents };
            }

            // 追加: 指定範囲内のイベントだけを抽出
            getEventsInRange(start, end) {
                const filtered = {};
                Object.keys(this.events).forEach(date => {
                    if (date >= start && date <= end) {
                        filtered[date] = this.events[date];
                    }
                });
                return filtered;
            }

            startEditing(dateStr) {
                this.selectedDate = dateStr;
                const originalEvents = this.events[dateStr] || [];
                this.editingEvents = JSON.parse(JSON.stringify(originalEvents));
            }

            commitEditing() {
                if (!this.selectedDate) return;
                if (this.editingEvents.length === 0) {
                    delete this.events[this.selectedDate];
                } else {
                    this.events[this.selectedDate] = JSON.parse(JSON.stringify(this.editingEvents));
                }
            }

            cancelEditing() {
                this.editingEvents = [];
            }

            hasUnsavedChanges() {
                if (!this.selectedDate) return false;
                const original = this.events[this.selectedDate] || [];
                return JSON.stringify(original) !== JSON.stringify(this.editingEvents);
            }

            addEditingEvent(text) {
                this.editingEvents.push({ id: Utils.generateUUID(), text: text });
            }
            removeEditingEvent(id) {
                this.editingEvents = this.editingEvents.filter(e => e.id !== id);
            }
            updateEditingEvent(id, text) {
                const event = this.editingEvents.find(e => e.id === id);
                if (event) event.text = text;
            }
            setEditingEvents(events) {
                this.editingEvents = events;
            }
        }

        // --- ビュー描画 ---
        class ViewRenderer {
            constructor(dom, store) {
                this.dom = dom;
                this.store = store;
            }

            render() {
                const isList = this.store.isListViewEnabled;
                this.dom.get('calendarGridTable').style.display = isList ? 'none' : 'table';
                this.dom.get('listView').style.display = isList ? 'block' : 'none';
                this.dom.get('editModeContainer').style.display = isList ? 'none' : 'block';
                this.dom.get('printListBtn').style.display = isList ? 'inline-block' : 'none';
                this.dom.get('listViewToggle').textContent = isList ? 'カレンダー表示' : 'リスト表示';

                if (isList) this.renderListView();
                else this.renderCalendar();
            }

            renderCalendar() {
                const tbody = this.dom.get('calendarBody');
                tbody.innerHTML = '';
                const date = this.store.calendarDate;
                const year = date.getFullYear();
                const month = date.getMonth();
                
                this.dom.get('monthYear').textContent = `${year}年 ${month + 1}月`;

                const firstDay = new Date(year, month, 1);
                const currentDay = new Date(firstDay);
                currentDay.setDate(1 - firstDay.getDay());
                const nextMonthFirstDay = new Date(year, month + 1, 1);

                for (let i = 0; i < 6; i++) {
                    if (i > 0 && currentDay >= nextMonthFirstDay) break;
                    const row = tbody.insertRow();
                    for (let j = 0; j < 7; j++) {
                        this._renderDayCell(row.insertCell(), new Date(currentDay));
                        currentDay.setDate(currentDay.getDate() + 1);
                    }
                }
            }

            _renderDayCell(cell, date) {
                const dateStr = Utils.formatDate(date);
                cell.dataset.date = dateStr;
                
                if (date.getMonth() !== this.store.calendarDate.getMonth()) cell.classList.add('other-month');
                if (dateStr === Utils.formatDate(new Date())) cell.classList.add('today');

                const eventsHtml = this._createEventListHtml(this.store.events[dateStr] || [], 'calendar');
                cell.innerHTML = this._createDayHeader(date, dateStr) + `<ul class="events-list">${eventsHtml}</ul>`;
            }

            _createDayHeader(date, dateStr) {
                const day = date.getDay();
                const classes = ['day-number'];
                if (day === 0) classes.push('sunday');
                if (day === 6) classes.push('saturday');
                if (this.store.holidays[dateStr]) classes.push('holiday');

                const holidayName = this.store.holidays[dateStr] 
                    ? `<div class="holiday-name">${Utils.escapeHtml(this.store.holidays[dateStr])}</div>` : '';
                
                return `<div class="day-header-container"><div class="${classes.join(' ')}">${date.getDate()}</div>${holidayName}</div>`;
            }

            renderListView() {
                const container = this.dom.get('listView');
                const oldList = container.querySelector('.list-view-events');
                if (oldList) oldList.remove();

                const { monday, sunday } = this._getWeekRange(this.store.listDate);
                this.dom.get('monthYear').textContent = this._getWeekHeader(monday, sunday);

                let html = '<ul class="list-view-events">';
                for (let i = 0; i < 7; i++) {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    html += this._createListViewDayItem(d);
                }
                html += '</ul>';
                container.insertAdjacentHTML('beforeend', html);
            }

            _createListViewDayItem(date) {
                const dateStr = Utils.formatDate(date);
                const events = this.store.events[dateStr] || [];
                const holiday = this.store.holidays[dateStr];
                const hasEvents = events.length > 0;
                const weekDays = ['日', '月', '火', '水', '木', '金', '土'];

                const holidayHtml = holiday ? `<span class="list-view-holiday-name"> (${Utils.escapeHtml(holiday)})</span>` : '';
                const headerHtml = `<div class="list-view-date-header"><strong>${date.getMonth() + 1}/${date.getDate()} (${weekDays[date.getDay()]})</strong>${holidayHtml}</div>`;
                
                let contentHtml;
                if (hasEvents) {
                    const items = events.map(e => {
                        const cls = this._getEventClass(e.text);
                        return `<li class="list-view-event-item"><span class="${cls}">${Utils.escapeHtml(e.text)}</span></li>`;
                    }).join('');
                    contentHtml = `<ul class="list-view-day-events">${items}</ul>`;
                } else {
                    contentHtml = `<p class="list-view-no-events">予定なし</p>`;
                }

                return `<li class="list-view-day-item ${!hasEvents ? 'has-no-events' : ''}" data-date="${dateStr}">${headerHtml}${contentHtml}</li>`;
            }

            renderModal() {
                const dateStr = this.store.selectedDate;
                const holiday = this.store.holidays[dateStr];
                this.dom.get('eventDate').textContent = holiday ? `${dateStr} (${holiday})` : dateStr;

                this.dom.get('templateButtons').innerHTML = CONSTANTS.EVENT_TEMPLATES.map(t => 
                    `<button class="template-btn">${Utils.escapeHtml(t)}</button>`
                ).join('');

                const events = this.store.editingEvents;
                const listHtml = events.length === 0 ? '<li>予定はありません</li>' 
                    : this._createEventListHtml(events, 'modal');
                
                this.dom.get('modalEventsList').innerHTML = listHtml;
                this.dom.get('eventModal').style.display = 'flex';
            }

            _createEventListHtml(events, context) {
                return events.map(e => {
                    const safeText = Utils.escapeHtml(e.text);
                    const cls = this._getEventClass(e.text);
                    const handle = (this.store.isDragModeEnabled || context === 'modal') ? `<span class="drag-handle">&#9776;</span>` : '';
                    const delBtn = (context === 'modal') ? `<button class="delete-event" data-event-id="${e.id}">削除</button>` : '';
                    return `<li data-event-id="${e.id}" class="${cls}">${handle}<span class="event-text">${safeText}</span>${delBtn}</li>`;
                }).join('');
            }

            _getEventClass(text) {
                const match = text.match(/【(.+?)】/);
                const type = match ? `event-${match[1].toLowerCase()}` : 'event-default';
                const map = { 'event-醤油': 'event-shoyu', 'event-味噌': 'event-miso', 'event-納豆': 'event-natto', 'event-休み': 'event-yasumi' };
                return map[type] || 'event-default';
            }

            _getWeekRange(date) {
                const d = new Date(date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(d.setDate(diff));
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                return { monday, sunday };
            }

            _getWeekHeader(start, end) {
                const f = d => ({ y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate() });
                const s = f(start), e = f(end);
                if (s.y !== e.y) return `${s.y}年${s.m}月${s.d}日 - ${e.y}年${e.m}月${e.d}日`;
                if (s.m !== e.m) return `${s.y}年${s.m}月${s.d}日 - ${e.m}月${e.d}日`;
                return `${s.y}年${s.m}月${s.d}日 - ${e.d}日`;
            }

            prepareForPrint() {
                const { monday, sunday } = this._getWeekRange(this.store.listDate);
                this.dom.get('printTitle').textContent = `週間予定 (${this._getWeekHeader(monday, sunday)})`;
            }
        }

        // --- コントローラー ---
        class AppController {
            constructor() {
                this.dom = new DOMManager();
                this.api = new ApiService();
                this.store = new Store();
                this.renderer = new ViewRenderer(this.dom, this.store);
                
                this.saveTimeout = null;
                this.statusClearTimeout = null;
                this.touchStartX = 0;
                this.calendarSortableInstances = [];
                this.modalSortable = null;
            }

            async init() {
                this._setSaveStatus('saving', 'データを読み込み中...');
                try {
                    const holidays = await this.api.fetchHolidays();
                    this.store.holidays = holidays || {};
                    await this.loadEventsForCurrentView();
                    this.renderer.render();
                    this._bindEvents();
                    this._initModalSortable();
                    this._setSaveStatus('saved', '読み込み完了', 1000);
                } catch (e) {
                    console.error(e);
                    this._setSaveStatus('error', '読み込みエラー');
                }
            }

            async loadEventsForCurrentView() {
                let startStr, endStr;
                if (this.store.isListViewEnabled) {
                    const { monday, sunday } = this.renderer._getWeekRange(this.store.listDate);
                    startStr = Utils.formatDate(monday);
                    endStr = Utils.formatDate(sunday);
                } else {
                    const d = this.store.calendarDate;
                    const start = new Date(d.getFullYear(), d.getMonth() - 1, 20);
                    const end = new Date(d.getFullYear(), d.getMonth() + 1, 15);
                    startStr = Utils.formatDate(start);
                    endStr = Utils.formatDate(end);
                }

                // 修正: 現在の範囲をStoreに保存
                this.store.currentRange = { start: startStr, end: endStr };

                this._setSaveStatus('saving', 'データ更新中...');
                try {
                    const newEvents = await this.api.fetchEvents(startStr, endStr);
                    this.store.mergeEvents(newEvents);
                    this._setSaveStatus('saved', '完了', 500);
                } catch (e) { console.error(e); }
            }

            _bindEvents() {
                const d = this.dom;
                d.get('prevMonthBtn').onclick = () => this.changePeriod(-1);
                d.get('nextMonthBtn').onclick = () => this.changePeriod(1);
                d.get('listViewToggle').onclick = () => this.toggleViewMode();
                d.get('dragModeToggle').onclick = () => this.toggleDragMode();
                d.get('printListBtn').onclick = () => { this.renderer.prepareForPrint(); window.print(); };
                d.get('saveModalBtn').onclick = () => this.saveModalChanges();

                d.get('calendarBody').onclick = e => {
                    const cell = e.target.closest('td[data-date]');
                    if (cell && !(this.store.isDragModeEnabled && e.target.closest('li'))) {
                        this.openModal(cell.dataset.date);
                    }
                };

                d.get('listView').onclick = e => {
                    const item = e.target.closest('.list-view-day-item[data-date]');
                    if (item) this.openModal(item.dataset.date);
                };

                // スワイプ操作
                d.get('listView').ontouchstart = e => this.touchStartX = e.changedTouches[0].screenX;
                d.get('listView').ontouchend = e => {
                    const endX = e.changedTouches[0].screenX;
                    if (Math.abs(this.touchStartX - endX) > CONSTANTS.SWIPE_THRESHOLD) {
                        this.changePeriod(endX < this.touchStartX ? 1 : -1);
                    }
                };

                // モーダル関連
                d.get('eventModal').onclick = e => {
                    if (e.target === d.get('eventModal') || e.target.classList.contains('modal-close')) {
                        this.confirmAndCloseModal();
                    }
                };
                d.get('addEventForm').onsubmit = e => {
                    e.preventDefault();
                    this.addEvent(d.get('newEventText').value);
                };
                d.get('templateButtons').onclick = e => {
                    if (e.target.classList.contains('template-btn')) this.addEvent(e.target.textContent);
                };
                d.get('modalEventsList').onclick = e => {
                    if (e.target.classList.contains('delete-event')) {
                        this.store.removeEditingEvent(e.target.dataset.eventId);
                        this.renderer.renderModal();
                    } else if (e.target.classList.contains('event-text')) {
                        this._switchToEditMode(e.target);
                    }
                };
            }

            changePeriod(dir) {
                if (this.store.isListViewEnabled) {
                    this.store.listDate.setDate(this.store.listDate.getDate() + (7 * dir));
                } else {
                    this.store.calendarDate.setMonth(this.store.calendarDate.getMonth() + dir);
                }
                this.renderer.render();
                this.loadEventsForCurrentView().then(() => this.renderer.render());
            }

            toggleViewMode() {
                if (this.store.isDragModeEnabled) this.toggleDragMode();
                this.store.isListViewEnabled = !this.store.isListViewEnabled;
                if (!this.store.isListViewEnabled) this.store.listDate = new Date(this.store.calendarDate);
                
                this.renderer.render();
                this.loadEventsForCurrentView().then(() => this.renderer.render());
            }

            toggleDragMode() {
                this.store.isDragModeEnabled = !this.store.isDragModeEnabled;
                const btn = this.dom.get('dragModeToggle');
                btn.textContent = this.store.isDragModeEnabled ? 'レイアウト編集を終了' : 'レイアウト編集を開始';
                btn.classList.toggle('active', this.store.isDragModeEnabled);
                this.dom.get('calendarContainer').classList.toggle('drag-mode-active', this.store.isDragModeEnabled);
                
                this.renderer.render();
                if (this.store.isDragModeEnabled) this._initCalendarSortable();
                else this._destroyCalendarSortable();
            }

            openModal(dateStr) {
                this.store.startEditing(dateStr);
                this.renderer.renderModal();
            }

            confirmAndCloseModal() {
                if (this.store.hasUnsavedChanges()) {
                    if (confirm('変更が保存されていません。\n保存せずに閉じてもよろしいですか？')) {
                        this.closeModal();
                    }
                } else {
                    this.closeModal();
                }
            }

            closeModal() {
                this.dom.get('eventModal').style.display = 'none';
                this.store.cancelEditing();
            }

            saveModalChanges() {
                this.store.commitEditing();
                this._debouncedSave();
                this.renderer.render();
                this.closeModal();
            }

            addEvent(text) {
                const t = text.trim();
                if (!t) return;
                this.store.addEditingEvent(t);
                this.dom.get('newEventText').value = '';
                this.renderer.renderModal();
            }

            _switchToEditMode(span) {
                const li = span.parentElement;
                const id = li.dataset.eventId;
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'event-input';
                input.value = span.textContent;
                li.insertBefore(input, span);
                li.removeChild(span);
                input.focus();
                
                const save = () => {
                    this.store.updateEditingEvent(id, input.value.trim());
                    this.renderer.renderModal();
                };
                input.onblur = save;
                input.onkeypress = e => { if (e.key === 'Enter') input.blur(); };
            }

            _setSaveStatus(status, msg, delay = null) {
                const el = this.dom.get('saveStatus');
                clearTimeout(this.statusClearTimeout);
                el.textContent = msg;
                el.className = `is-visible is-${status}`;
                if (delay) this.statusClearTimeout = setTimeout(() => el.className = '', delay);
            }

            _debouncedSave() {
                clearTimeout(this.saveTimeout);
                this._setSaveStatus('saving', '保存中...');
                this.saveTimeout = setTimeout(async () => {
                    try {
                        // 修正: 範囲内のデータだけを抽出して送信
                        const range = this.store.currentRange;
                        if (!range.start || !range.end) return;

                        const eventsToSend = this.store.getEventsInRange(range.start, range.end);
                        await this.api.saveEvents(eventsToSend, range);
                        
                        this._setSaveStatus('saved', '✓ 保存済み', 2000);
                    } catch (e) {
                        this._setSaveStatus('error', '保存に失敗しました');
                    }
                }, CONSTANTS.SAVE_DEBOUNCE_MS);
            }

            _initCalendarSortable() {
                this._destroyCalendarSortable();
                this.dom.get('calendarBody').querySelectorAll('.events-list').forEach(list => {
                    const sortable = new Sortable(list, {
                        group: 'shared-events', animation: 150, handle: '.drag-handle',
                        onEnd: evt => {
                            const { from, to, newIndex, item } = evt;
                            const oldDate = from.closest('td').dataset.date;
                            const newDate = to.closest('td').dataset.date;
                            const eventId = item.dataset.eventId;
                            const text = item.querySelector('.event-text').textContent;

                            // 修正: 安全なデータ操作
                            const sourceList = [...(this.store.events[oldDate] || [])];
                            const targetList = (oldDate === newDate) ? sourceList : [...(this.store.events[newDate] || [])];

                            const eventIndex = sourceList.findIndex(e => e.id === eventId);
                            if (eventIndex > -1) sourceList.splice(eventIndex, 1);

                            targetList.splice(newIndex, 0, { id: eventId, text: text });

                            if (sourceList.length === 0) delete this.store.events[oldDate];
                            else this.store.events[oldDate] = sourceList;
                            
                            this.store.events[newDate] = targetList;

                            this.renderer.render();
                            this._debouncedSave();
                        }
                    });
                    this.calendarSortableInstances.push(sortable);
                });
            }

            _destroyCalendarSortable() {
                this.calendarSortableInstances.forEach(s => s.destroy());
                this.calendarSortableInstances = [];
            }

            _initModalSortable() {
                if (this.modalSortable) this.modalSortable.destroy();
                this.modalSortable = new Sortable(this.dom.get('modalEventsList'), {
                    animation: 150, handle: '.drag-handle',
                    onEnd: evt => {
                        const newEvents = Array.from(evt.target.children).map(li => ({
                            id: li.dataset.eventId,
                            text: (li.querySelector('.event-text') || li.querySelector('.event-input')).value || li.querySelector('.event-text').textContent
                        }));
                        this.store.setEditingEvents(newEvents);
                    }
                });
            }
        }

        // --- アプリケーション起動 ---
        new AppController().init();
    });
    </script>
</body>
